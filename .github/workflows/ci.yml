name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal token scope; CI only reads repo contents.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # The SQLite backend is a single file, so its conformance suite needs
      # no service container and runs here rather than in the Postgres job.
      # (It also runs as part of `go test ./...` above; this step names it so
      # a regression in the shared suite is obvious in the CI log.)
      - name: Test (SQLite store conformance)
        run: go test ./internal/store/ -run TestSQLite -v

  # The same shared conformance suite again, this time with
  # TEST_DATABASE_URL set so it runs against Postgres too instead of
  # skipping. Both backends must pass identical assertions.
  test-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sorobeacon
          POSTGRES_PASSWORD: sorobeacon
          POSTGRES_DB: sorobeacon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sorobeacon"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test (with Postgres integration tests)
        run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://sorobeacon:sorobeacon@localhost:5432/sorobeacon?sslmode=disable

  # terraform-provider-sorobeacon/ is a nested module, so nothing above sees
  # it: `go build ./...` from the root stops at the subdirectory that carries
  # its own go.mod, by design. Without this job seven Go files ship with no
  # build check, no vet and no lint. The whole job runs inside the module
  # directory — that is the only thing that makes the commands see the
  # provider — and caches on the provider's own go.sum, because setup-go's
  # cache key comes from the go.sum it is pointed at.
  terraform-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform-provider-sorobeacon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: terraform-provider-sorobeacon/go.mod
          cache-dependency-path: terraform-provider-sorobeacon/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # The provider has no tests yet; running the command now means the job
      # already covers them on the day they land, rather than waiting for a
      # follow-up to notice a red suite.
      - name: Test
        run: go test ./... -count=1
      # A nested module drifts silently: nothing in the root module's build
      # notices an untidy go.mod here, and the next person to run tidy gets a
      # diff nobody reviewed.
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          working-directory: terraform-provider-sorobeacon

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2

  # The Helm chart is a deployment artifact like any other, so it is linted and
  # rendered on every change instead of rotting until someone tries to install
  # it. Mirrors the job in the sibling SoroTrail repository.
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.15.0
      # database.url is required (values.schema.json), so every render and
      # lint below passes one unless the case is specifically about it being
      # missing.
      - name: Helm lint (defaults)
        run: helm lint deploy/helm/sorobeacon --set database.url=postgres://user:pass@host:5432/db
      # A deliberately-invalid value: values.schema.json must reject it. If
      # lint succeeds here, the schema stopped being applied and this step
      # fails the build.
      - name: Helm lint (invalid replicaCount — schema must reject)
        run: |
          if helm lint deploy/helm/sorobeacon \
               --set database.url=postgres://user:pass@host:5432/db \
               --set replicaCount=not-a-number; then
            echo "::error::values.schema.json did not reject a non-numeric replicaCount"
            exit 1
          fi
      # Same for a missing database configuration: neither database.url nor
      # database.existingSecret is set, so the schema must reject the render.
      - name: Helm lint (missing database configuration — schema must reject)
        run: |
          if helm lint deploy/helm/sorobeacon; then
            echo "::error::values.schema.json did not reject a missing database configuration"
            exit 1
          fi
      - name: Helm template render (defaults)
        run: |
          helm template sorobeacon deploy/helm/sorobeacon \
            --set database.url=postgres://user:pass@host:5432/db \
            > /dev/null
      - name: Helm template render (existing secret)
        run: |
          helm template sorobeacon deploy/helm/sorobeacon \
            --set database.existingSecret=my-db-secret \
            > /dev/null
      - name: Helm template render (production values)
        run: |
          helm template sorobeacon deploy/helm/sorobeacon \
            --set database.existingSecret=my-db-secret \
            --set auth.existingSecret=my-auth-secret \
            --set replicaCount=3 \
            --set config.network=mainnet \
            --set config.rpcUrl=https://soroban-mainnet.example.org \
            --set config.logLevel=warn \
            --set config.alertRetention=90d \
            --set config.rateLimitRps=10 \
            --set config.rateLimitBurst=20 \
            --set migrations.enabled=true \
            --set resources.requests.cpu=250m \
            --set resources.requests.memory=256Mi \
            --set resources.limits.cpu=1000m \
            --set resources.limits.memory=512Mi \
            > /dev/null
      - name: Helm template render (image tag override)
        run: |
          helm template sorobeacon deploy/helm/sorobeacon \
            --set database.url=postgres://user:pass@host:5432/db \
            --set image.tag=v1.2.3 \
            --set config.pollInterval=30s \
            > /dev/null

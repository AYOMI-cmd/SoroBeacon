# The provider keeps its own lint configuration rather than inheriting the
# repository root's by directory search.
#
# golangci-lint walks up from the working directory, so running it here
# already picks up ../.golangci.yml — which is exactly the implicit
# dependency that makes lint surprising. Pinning the config makes the rules
# that gate this module a property of the module instead of a property of
# where the command happened to run.
#
# The linter set is deliberately identical to the root's today. The split is
# about what happens later: the provider is released separately from the
# server, so tightening a rule for the server should not start failing
# provider builds, and provider idioms (framework methods that satisfy an
# interface by returning diagnostics, constructors that exist to be handed to
# providerserver.Serve) will need rules the server has no use for.
#
# Add a linter here only after running it against this module — the same bar
# as anywhere else in the repo.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
    - unconvert
    - gocritic
    - revive
  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
        - fmt.Fprint
        - fmt.Fprintf
    revive:
      rules:
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck